server:
  port: ${PORT:8080}

spring:
  application:
    name: bravo-api
  datasource:
    # Runtime connection. With Supabase, use the pooled (PgBouncer, port 6543) URL here and append
    # ?prepareThreshold=0 so the driver doesn't use server-side prepared statements.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bravo}
    username: ${DATABASE_USER:bravo}
    password: ${DATABASE_PASSWORD:bravo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Migrations need a direct (non-pooled) connection. Falls back to DATABASE_URL for local dev.
    url: ${DATABASE_DIRECT_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/bravo}}
    user: ${DATABASE_USER:bravo}
    password: ${DATABASE_PASSWORD:bravo}

management:
  endpoints:
    web:
      exposure:
        include: health

bravo:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    slot-step-minutes: 15
    min-notice-minutes: 60
    max-advance-days: 60
  auth:
    # Clerk: issuer is your Frontend API URL, e.g. https://your-app.clerk.accounts.dev
    # JWKS URL is <issuer>/.well-known/jwks.json. Leave blank to run without manager auth.
    issuer: ${CLERK_ISSUER:}
    jwks-url: ${CLERK_JWKS_URL:}
  email:
    # Blank key = emails are logged instead of sent.
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:Bravo Appointments <onboarding@resend.dev>}
