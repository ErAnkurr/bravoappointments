# Local development.
#   docker compose up -d db          -> just Postgres (run the API and web app on your machine)
#   docker compose --profile full up -> Postgres + API in containers (dev profile, demo data)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bravo
      POSTGRES_USER: bravo
      POSTGRES_PASSWORD: bravo
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bravo -d bravo']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['full']
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://db:5432/bravo
      DATABASE_USER: bravo
      DATABASE_PASSWORD: bravo
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Bravo Appointments <onboarding@resend.dev>}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - '8080:8080'

volumes:
  pgdata:
